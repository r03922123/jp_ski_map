[project]
name = "hakuba-search"
version = "0.1.0"
description = "Offline tooling for semantic place search: embedding server, synthetic data, fine-tuning, evals"
requires-python = ">=3.12"
dependencies = [
    "hakuba-api",
    "sentence-transformers>=5.0",
    "mlflow>=3.0",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[tool.uv.sources]
hakuba-api = { path = "../../services/api", editable = true }

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
